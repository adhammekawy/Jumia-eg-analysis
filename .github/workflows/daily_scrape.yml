name: Jumia Daily Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Show scraper output
        run: |
          echo "=== data folder contents ==="
          ls -la data/ || echo "data/ folder missing"
          echo "=== last 20 lines of log ==="
          cat scraper.log 2>/dev/null || echo "no log file"

      - name: Run Scraper
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Auto-update: $(date +'%Y-%m-%d') Jumia Snapshot" || echo "No changes to commit"
          git push
          git config --global user.name "github-actions[bot]"
